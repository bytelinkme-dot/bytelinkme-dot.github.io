<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byte Link — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23EEEAFF'/%3E%3Ccircle cx='14' cy='24' r='3.4' fill='%23FF7452'/%3E%3Ccircle cx='22' cy='14' r='4' fill='%237C6CF6'/%3E%3Ccircle cx='28' cy='24' r='3' fill='%233E8EFD'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F6F5FF; --ink:#211D45; --slate:#6C6B8A; --purple:#7C6CF6; --purple-soft:#EEEAFF;
    --blue:#3E8EFD; --blue-soft:#E7F1FF; --coral:#FF7452; --coral-soft:#FFECE4;
    --yellow:#FFB443; --yellow-soft:#FFF3DD; --mint:#22BFAE; --mint-soft:#E1FAF6;
    --card:#FFFFFF; --line:#EAE7FA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .view{display:none;}
  .view.active{display:block;}

  .topbar{max-width:1160px;margin:0 auto;padding:26px 28px 0;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--purple);}
  .back-link{font-size:13.5px;color:var(--slate);font-weight:800;background:var(--card);padding:10px 18px;border-radius:999px;}
  .back-link:hover{color:var(--ink);}

  .eyebrow-pill{display:inline-flex;align-items:center;gap:8px;background:var(--yellow-soft);color:#A6690C;font-size:13px;font-weight:800;padding:8px 18px;border-radius:999px;margin-bottom:24px;}
  .btn-primary{background:var(--purple);color:#fff;border:none;padding:16px 30px;border-radius:999px;font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:9px;box-shadow:0 10px 24px -8px rgba(124,108,246,0.55);transition:transform .15s ease,box-shadow .15s ease;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -8px rgba(124,108,246,0.65);}
  .btn-secondary{background:#fff;color:var(--ink);border:2.5px solid var(--ink);padding:13.5px 26px;border-radius:999px;font-size:15px;font-weight:800;transition:all .15s ease;}
  .btn-secondary:hover{background:var(--ink);color:#fff;}

  .form-card{background:var(--card);border-radius:28px;padding:38px;box-shadow:0 14px 40px -18px rgba(33,29,69,0.2);text-align:left;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px;color:var(--ink);}
  .field input,.field select{width:100%;padding:13px 18px;border:2px solid var(--line);border-radius:16px;font-size:14.5px;font-family:inherit;font-weight:600;background:var(--bg);color:var(--ink);transition:border-color .15s ease;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--purple);background:#fff;}
  .form-submit{width:100%;margin-top:8px;justify-content:center;}
  .form-note{font-size:12.5px;color:var(--slate);margin-top:14px;text-align:center;font-weight:700;}

  .admin-gate{max-width:400px;margin:110px auto 0;padding:0 28px;text-align:center;}
  .admin-wrap{max-width:1160px;margin:0 auto;padding:50px 28px 100px;}
  .admin-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;flex-wrap:wrap;gap:16px;}
  .admin-top h2{font-size:27px;margin:0 0 6px;font-weight:600;}
  .admin-top p{color:var(--slate);font-size:14px;margin:0;font-weight:600;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
  .admin-stat{border-radius:20px;padding:20px 22px;}
  .admin-stat .num{font-family:'Fredoka',sans-serif;font-size:27px;font-weight:600;display:block;}
  .admin-stat .lbl{font-size:12px;font-weight:700;margin-top:4px;opacity:0.8;}
  .admin-toolbar{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .admin-toolbar select,.admin-toolbar input{padding:11px 16px;border:2px solid var(--line);border-radius:999px;font-size:13.5px;background:#fff;font-family:inherit;font-weight:700;}
  table{width:100%;border-collapse:separate;border-spacing:0 10px;}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);padding:0 18px 6px;font-weight:800;}
  tbody tr{background:var(--card);box-shadow:0 4px 14px -10px rgba(33,29,69,0.2);}
  tbody td{padding:15px 18px;font-size:14px;font-weight:600;}
  tbody td:first-child{border-radius:16px 0 0 16px;}
  tbody td:last-child{border-radius:0 16px 16px 0;}
  .del-btn{background:var(--coral-soft);color:#C24522;border:none;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;}
  .del-btn:hover{background:var(--coral);color:#fff;}
  .empty-state{text-align:center;padding:70px 20px;color:var(--slate);background:var(--card);border-radius:24px;font-weight:700;}
  .course-pill{font-size:12px;font-weight:800;background:var(--purple-soft);color:var(--purple);padding:5px 12px;border-radius:999px;}
  .logout-link{font-size:13.5px;color:var(--slate);font-weight:800;background:var(--card);padding:10px 18px;border-radius:999px;}
  .logout-link:hover{color:var(--ink);}

  @media(max-width:860px){
    .stat-row{grid-template-columns:1fr 1fr;}
  }
  :focus-visible{outline:3px solid var(--purple);outline-offset:2px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Byte Link Admin</div>
  <a class="back-link" href="index.html">← Back to site</a>
</div>

<div id="view-gate" class="view active">
  <div class="admin-gate">
    <div class="eyebrow-pill" style="display:inline-flex;">Staff only</div>
    <h2 style="font-size:26px;font-weight:600;margin:0 0 26px;">Admin sign in</h2>
    <div class="form-card">
      <div class="field">
        <label>Access code</label>
        <input type="password" id="admin-pass" placeholder="Enter admin code" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <button class="btn-primary form-submit" onclick="adminLogin()">Sign in</button>
      <p class="form-note" id="admin-error" style="color:#C24522;display:none;">Incorrect code — try again.</p>
    </div>
  </div>
</div>

<div id="view-panel" class="view">
  <div class="admin-wrap">
    <div class="admin-top">
      <div>
        <h2>Registered students</h2>
        <p>Every registration submitted through the site, stored in the shared Byte Link database.</p>
      </div>
      <a class="logout-link" href="javascript:void(0)" onclick="adminLogout()">Sign out</a>
    </div>
    <div class="stat-row" id="admin-stats"></div>
    <div class="admin-toolbar">
      <select id="filter-course" onchange="renderAdminTable()">
        <option value="">All courses</option>
      </select>
      <input type="text" id="search-student" placeholder="Search by name or email…" oninput="renderAdminTable()" style="min-width:240px;">
      <button class="btn-secondary" style="padding:11px 20px;font-size:13px;" onclick="exportCSV()">Export CSV</button>
    </div>
    <div id="admin-table-wrap"></div>

    <div class="admin-top" style="margin-top:56px;">
      <div>
        <h2>Newsletter subscribers</h2>
        <p>Everyone who signed up for cohort notifications.</p>
      </div>
    </div>
    <div class="stat-row" id="newsletter-stats"></div>
    <div class="admin-toolbar">
      <input type="text" id="search-subscriber" placeholder="Search by email…" oninput="renderNewsletterTable()" style="min-width:240px;">
      <button class="btn-secondary" style="padding:11px 20px;font-size:13px;" onclick="exportNewsletterCSV()">Export CSV</button>
    </div>
    <div id="newsletter-table-wrap"></div>
  </div>
</div>

<script>
const PALETTE = [
  { soft:'var(--purple-soft)', solid:'var(--purple)' },
  { soft:'var(--blue-soft)',   solid:'var(--blue)'   },
  { soft:'var(--coral-soft)',  solid:'var(--coral)'  },
  { soft:'var(--mint-soft)',   solid:'var(--mint)'   }
];
const ADMIN_CODE = 'bytelink2026'; // change this to something less guessable

// ---------- Supabase ----------
const SUPABASE_URL = 'https://zxbhjqctklyevnctuqsn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4YmhqcWN0a2x5ZXZuY3R1cXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTAxNDUsImV4cCI6MjEwMjUyNjE0NX0.3wt9FDZ2C30zbswzSZvbHlY9LnAIS1uW7dkAPEPHUvg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let studentsCache = [];
let newsletterCache = [];
let COURSES = [];

function rowToStudent(r){
  return { id:r.id, firstName:r.first_name, lastName:r.last_name, email:r.email,
    phone:r.phone, notes:r.notes, courseId:r.course_id, courseTitle:r.course_title,
    registeredAt:r.registered_at };
}
function rowToSub(r){ return { id:r.id, email:r.email, subscribedAt:r.subscribed_at }; }

async function loadCourses(){
  const { data, error } = await sb.from('courses').select('*').order('sort_order', { ascending:true });
  if(error){ console.error('Supabase loadCourses error', error); COURSES = []; return; }
  COURSES = (data||[]).map(r => ({ id:r.id, title:r.title }));
}
async function loadStudents(){
  const { data, error } = await sb.from('students').select('*').order('registered_at', { ascending:false });
  studentsCache = error || !data ? [] : data.map(rowToStudent);
  if(error) console.error('Supabase loadStudents error', error);
}
async function deleteStudentRow(id){
  const { error } = await sb.from('students').delete().eq('id', id);
  if(error) console.error('Supabase deleteStudent error', error);
}
async function loadNewsletter(){
  const { data, error } = await sb.from('newsletter').select('*').order('subscribed_at', { ascending:false });
  newsletterCache = error || !data ? [] : data.map(rowToSub);
  if(error) console.error('Supabase loadNewsletter error', error);
}
async function deleteSubscriberRow(id){
  const { error } = await sb.from('newsletter').delete().eq('id', id);
  if(error) console.error('Supabase deleteSubscriber error', error);
}

function adminLogin(){
  const val = document.getElementById('admin-pass').value;
  if(val === ADMIN_CODE){
    document.getElementById('admin-error').style.display = 'none';
    document.getElementById('admin-pass').value = '';
    document.getElementById('view-gate').classList.remove('active');
    document.getElementById('view-panel').classList.add('active');
    renderAdmin();
  }else{ document.getElementById('admin-error').style.display = 'block'; }
}
function adminLogout(){
  document.getElementById('view-panel').classList.remove('active');
  document.getElementById('view-gate').classList.add('active');
}

async function renderAdmin(){
  await loadCourses();
  await loadStudents();
  const sel = document.getElementById('filter-course');
  sel.innerHTML = '<option value="">All courses</option>' + COURSES.map(c=>`<option value="${c.id}">${c.title}</option>`).join('');
  renderAdminStats(); renderAdminTable();
  await loadNewsletter();
  renderNewsletterStats(); renderNewsletterTable();
}
function renderAdminStats(){
  const total = studentsCache.length;
  const uniqueCourses = new Set(studentsCache.map(s=>s.courseId)).size;
  const topCourse = COURSES.map(c=>({c, n: studentsCache.filter(s=>s.courseId===c.id).length})).sort((a,b)=>b.n-a.n)[0];
  const thisWeek = studentsCache.filter(s=>(Date.now()-new Date(s.registeredAt).getTime())<7*24*60*60*1000).length;
  const cols = [PALETTE[0],PALETTE[1],PALETTE[2],PALETTE[3]];
  document.getElementById('admin-stats').innerHTML = `
    <div class="admin-stat" style="background:${cols[0].soft};color:${cols[0].solid};"><span class="num">${total}</span><div class="lbl">Total registrations</div></div>
    <div class="admin-stat" style="background:${cols[1].soft};color:${cols[1].solid};"><span class="num">${uniqueCourses}</span><div class="lbl">Courses with students</div></div>
    <div class="admin-stat" style="background:${cols[2].soft};color:${cols[2].solid};"><span class="num">${topCourse && topCourse.n>0 ? topCourse.n : 0}</span><div class="lbl">${topCourse && topCourse.n>0 ? topCourse.c.title : 'No registrations yet'}</div></div>
    <div class="admin-stat" style="background:${cols[3].soft};color:${cols[3].solid};"><span class="num">${thisWeek}</span><div class="lbl">New this week</div></div>
  `;
}
function renderAdminTable(){
  const courseFilter = document.getElementById('filter-course').value;
  const search = document.getElementById('search-student').value.toLowerCase();
  let rows = studentsCache.filter(s=>{
    const matchCourse = !courseFilter || s.courseId === courseFilter;
    const matchSearch = !search || (s.firstName+' '+s.lastName+' '+s.email).toLowerCase().includes(search);
    return matchCourse && matchSearch;
  }).sort((a,b)=> new Date(b.registeredAt) - new Date(a.registeredAt));
  const wrap = document.getElementById('admin-table-wrap');
  if(rows.length === 0){ wrap.innerHTML = `<div class="empty-state">No registrations match yet — once students sign up, they'll show up here.</div>`; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Student</th><th>Contact</th><th>Course</th><th>Registered</th><th></th></tr></thead>
      <tbody>
        ${rows.map(s=>`
          <tr>
            <td><strong>${s.firstName} ${s.lastName}</strong>${s.notes ? `<div style="font-size:12px;color:var(--slate);margin-top:3px;font-weight:600;">${s.notes}</div>` : ''}</td>
            <td>${s.email}<div style="font-size:12px;color:var(--slate);font-weight:600;">${s.phone}</div></td>
            <td><span class="course-pill">${s.courseTitle}</span></td>
            <td style="font-size:12.5px;">${new Date(s.registeredAt).toLocaleDateString()}</td>
            <td><button class="del-btn" onclick="deleteStudent('${s.id}')">Remove</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}
function exportCSV(){
  if(studentsCache.length === 0){ return; }
  const headers = ['First name','Last name','Email','Phone','Course','Registered at','Notes'];
  const rows = studentsCache.map(s => [s.firstName, s.lastName, s.email, s.phone, s.courseTitle, s.registeredAt, (s.notes||'').replace(/\n/g,' ')]);
  const csv = [headers, ...rows].map(row =>
    row.map(field => `"${String(field).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `byte-link-students-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function deleteStudent(id){
  await deleteStudentRow(id);
  await loadStudents(); renderAdminStats(); renderAdminTable();
}

function renderNewsletterStats(){
  const total = newsletterCache.length;
  const thisWeek = newsletterCache.filter(s=>s.subscribedAt && (Date.now()-new Date(s.subscribedAt).getTime())<7*24*60*60*1000).length;
  const cols = [PALETTE[0],PALETTE[3]];
  document.getElementById('newsletter-stats').innerHTML = `
    <div class="admin-stat" style="background:${cols[0].soft};color:${cols[0].solid};"><span class="num">${total}</span><div class="lbl">Total subscribers</div></div>
    <div class="admin-stat" style="background:${cols[1].soft};color:${cols[1].solid};"><span class="num">${thisWeek}</span><div class="lbl">New this week</div></div>
  `;
}
function renderNewsletterTable(){
  const search = document.getElementById('search-subscriber').value.toLowerCase();
  let rows = newsletterCache.filter(s => !search || s.email.toLowerCase().includes(search))
    .sort((a,b) => new Date(b.subscribedAt || 0) - new Date(a.subscribedAt || 0));
  const wrap = document.getElementById('newsletter-table-wrap');
  if(rows.length === 0){ wrap.innerHTML = `<div class="empty-state">No subscribers match yet — once people sign up, they'll show up here.</div>`; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Email</th><th>Subscribed</th><th></th></tr></thead>
      <tbody>
        ${rows.map(s=>`
          <tr>
            <td>${s.email}</td>
            <td style="font-size:12.5px;">${s.subscribedAt ? new Date(s.subscribedAt).toLocaleDateString() : '—'}</td>
            <td><button class="del-btn" onclick="deleteSubscriber('${s.id}')">Remove</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}
function exportNewsletterCSV(){
  if(newsletterCache.length === 0){ return; }
  const headers = ['Email','Subscribed at'];
  const rows = newsletterCache.map(s => [s.email, s.subscribedAt || '']);
  const csv = [headers, ...rows].map(row =>
    row.map(field => `"${String(field).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `byte-link-newsletter-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function deleteSubscriber(id){
  await deleteSubscriberRow(id);
  await loadNewsletter(); renderNewsletterStats(); renderNewsletterTable();
}
</script>
</body>
</html>
